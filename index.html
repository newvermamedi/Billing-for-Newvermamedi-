<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Verma Medicals - Billing System</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { margin: 15px; background-color: #f4f7f6; color: #333; }
    .container { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: auto; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Header & Logo */
    .bill-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 15px; }
    .shop-logo { max-height: 70px; max-width: 150px; object-fit: contain; }
    .shop-title { font-size: 20px; font-weight: bold; color: #0056b3; }
    
    /* Customer Details Input */
    .customer-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .customer-info label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 3px; }
    .customer-info input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    th { background-color: #0056b3; color: white; }

    /* Buttons & Actions */
    button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-add { background-color: #28a745; color: white; margin-top: 10px; }
    .btn-print { background-color: #0056b3; color: white; margin-top: 15px; width: 100%; }
    .btn-delete { background-color: #dc3545; color: white; font-size: 12px; padding: 4px 8px; }
    .btn-clear-history { background-color: #dc3545; color: white; float: right; }

    .total-section { font-size: 18px; font-weight: bold; text-align: right; margin-top: 10px; }
    
    /* Print Hide Styling */
    @media print {
      .no-print, button { display: none !important; }
      body { margin: 0; background: white; }
      .card { box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Bill Generator Card -->
  <div class="card" id="billArea">
    <div class="bill-header">
      <div>
        <div class="shop-title">New Verma Medicals</div>
        <p style="font-size:12px; color:#666;">Medical & General Store</p>
      </div>
      <!-- Uploaded Image Name -->
      <img src="Screenshot_20261002-202708_Photos~2.jpg" alt="Logo" class="shop-logo" onerror="this.style.display='none'">
    </div>

    <!-- Customer Information -->
    <div class="customer-info">
      <div>
        <label>Customer Name:</label>
        <input type="text" id="custName" placeholder="ग्राहक का नाम दर्ज करें">
      </div>
      <div>
        <label>Customer Number:</label>
        <input type="text" id="custPhone" placeholder="मोबाइल नंबर दर्ज करें">
      </div>
    </div>

    <!-- Bill Items Table -->
    <table id="billTable">
      <thead>
        <tr>
          <th>Item Name</th>
          <th style="width: 80px;">Qty</th>
          <th style="width: 100px;">Price</th>
          <th style="width: 100px;">Total</th>
          <th class="no-print" style="width: 50px;">Action</th>
        </tr>
      </thead>
      <tbody id="billBody">
        <tr>
          <td><input type="text" style="width:100%; padding:4px;" class="item-name" placeholder="दवा का नाम"></td>
          <td><input type="number" style="width:100%; padding:4px;" class="item-qty" value="1" onchange="calculateTotal()"></td>
          <td><input type="number" style="width:100%; padding:4px;" class="item-price" value="0" onchange="calculateTotal()"></td>
          <td class="item-total">0.00</td>
          <td class="no-print"><button class="btn-delete" onclick="removeRow(this)">X</button></td>
        </tr>
      </tbody>
    </table>

    <button class="btn-add no-print" onclick="addRow()">+ Add Item</button>

    <div class="total-section">
      Grand Total: ₹<span id="grandTotal">0.00</span>
    </div>

    <button class="btn-print no-print" onclick="printAndSave()">Print & Save Bill</button>
  </div>

  <!-- History Card -->
  <div class="card no-print">
    <h3>
      Billing History
      <button class="btn-clear-history" onclick="clearHistory()">Clear History</button>
    </h3>
    <br>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>Customer Name</th>
          <th>Phone</th>
          <th>Total Amount</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
  function addRow() {
    const tbody = document.getElementById('billBody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" style="width:100%; padding:4px;" class="item-name" placeholder="दवा का नाम"></td>
      <td><input type="number" style="width:100%; padding:4px;" class="item-qty" value="1" onchange="calculateTotal()"></td>
      <td><input type="number" style="width:100%; padding:4px;" class="item-price" value="0" onchange="calculateTotal()"></td>
      <td class="item-total">0.00</td>
      <td class="no-print"><button class="btn-delete" onclick="removeRow(this)">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function removeRow(btn) {
    const row = btn.parentElement.parentElement;
    row.remove();
    calculateTotal();
  }

  function calculateTotal() {
    let grandTotal = 0;
    const rows = document.querySelectorAll('#billBody tr');
    rows.forEach(row => {
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      const total = qty * price;
      row.querySelector('.item-total').innerText = total.toFixed(2);
      grandTotal += total;
    });
    document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
  }

  function printAndSave() {
    const name = document.getElementById('custName').value || 'N/A';
    const phone = document.getElementById('custPhone').value || 'N/A';
    const total = document.getElementById('grandTotal').innerText;
    const date = new Date().toLocaleString('hi-IN');

    if (total === '0.00') {
      alert('कृपया बिल में आइटम जोड़ें!');
      return;
    }

    // Save to LocalStorage History
    const history = JSON.parse(localStorage.getItem('billHistory') || '[]');
    history.push({ date, name, phone, total });
    localStorage.setItem('billHistory', JSON.stringify(history));

    renderHistory();
    window.print();
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('billHistory') || '[]');
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';
    history.reverse().forEach(item => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.date}</td>
        <td>${item.name}</td>
        <td>${item.phone}</td>
        <td>₹${item.total}</td>
      `;
      tbody.appendChild(row);
    });
  }

  function clearHistory() {
    if (confirm('क्या आप सच में अपनी पूरी बिलिंग हिस्ट्री डिलीट करना चाहते हैं?')) {
      localStorage.removeItem('billHistory');
      renderHistory();
    }
  }

  // Load history on startup
  renderHistory();
</script>

</body>
</html>
